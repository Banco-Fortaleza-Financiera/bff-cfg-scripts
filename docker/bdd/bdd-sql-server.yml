services:
  sqlserver:
    image: ${SQLSERVER_IMAGE}
    container_name: ${CONTAINER_NAME}
    restart: always

    ports:
      - "127.0.0.1:${SQLSERVER_PORT}:1433"

    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}

    volumes:
      - sqlserver_data:/var/opt/mssql

    networks:
      - sqlnet

  sqlserver-init:
    image: ${SQLSERVER_IMAGE}
    container_name: ${CONTAINER_NAME}_init
    depends_on:
      - sqlserver
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_APP_USER: ${DB_APP_USER}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
    volumes:
      - ./schema.sql:/schema.sql:ro
    command:
      - /bin/bash
      - -c
      - |
        until /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${SA_PASSWORD}" -Q "SELECT 1" -b -C; do
          sleep 2;
        done;
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P "$${SA_PASSWORD}" -i /schema.sql -b -C -v DB_NAME="$${DB_NAME}" DB_APP_USER="$${DB_APP_USER}" DB_APP_PASSWORD="$${DB_APP_PASSWORD}"
    networks:
      - sqlnet
    restart: "no"

volumes:
  sqlserver_data:
    name: ${VOLUME_NAME}

networks:
  sqlnet:
    name: ${NETWORK_NAME}
